# ============================================================
# 智能试卷生成系统 - Docker Compose 编排
# ============================================================
# 服务: Flask API + Celery Worker + Celery Beat + Redis + Prometheus + Grafana
#
# 使用方式:
#   全栈启动:    docker-compose up -d
#   扩展 Worker: docker-compose up -d --scale celery_worker=4
#   仅监控栈:   docker-compose -f docker-compose.monitoring.yml up -d
#   查看日志:    docker-compose logs -f api
#   停止:        docker-compose down -v
# ============================================================

version: "3.9"

services:
  # -------------------- Flask API 服务 --------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: exam-api
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - SERVER_DEBUG=${SERVER_DEBUG:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CACHE_BACKEND=redis
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - LANGCHAIN_PROJECT=exam-paper-generator
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
    volumes:
      - exam_data:/app/data
      - exam_logs:/app/logs
      - exam_output:/app/output
      - ./backend/.env:/app/backend/.env:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - exam-network

  # -------------------- Celery Worker --------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: exam-celery
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
      --max-tasks-per-child=50
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_TASK_TIMEOUT=${CELERY_TASK_TIMEOUT:-120}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
    volumes:
      - exam_data:/app/data
      - exam_logs:/app/logs
      - ./backend/.env:/app/backend/.env:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - exam-network
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  # -------------------- Celery Beat --------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: exam-celery-beat
    command: celery -A backend.celery_app beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - exam_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - exam-network

  # -------------------- Redis --------------------
  redis:
    image: redis:7-alpine
    container_name: exam-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - exam-network

  # -------------------- 前端 Nginx --------------------
  frontend:
    image: nginx:1.25-alpine
    container_name: exam-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - frontend

volumes:
  exam_data:
    name: exam_data
  exam_logs:
    name: exam_logs
  exam_output:
    name: exam_output
  redis_data:
    name: exam_redis_data

networks:
  exam-network:
    driver: bridge
